name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitediary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sitediary_test
      DATABASE_URL: postgres://app_user:ci_app_password@localhost:5432/sitediary_test
      APP_DB_PASSWORD: ci_app_password
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
      APP_BASE_URL: http://localhost:5173
      PLATFORM_ADMIN_EMAILS: owner@sitediary.test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web exec playwright test
        env:
          CI: true
